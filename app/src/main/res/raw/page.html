<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>局域网快传</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
         background:#111418; color:#e8eaed; padding:20px 16px 40px; }
  h1 { font-size:20px; margin:6px 0 2px; }
  .sub { color:#8b949e; font-size:13px; margin-bottom:18px; }
  .card { background:#1b2027; border:1px solid #262d36; border-radius:14px; padding:16px; margin-bottom:14px; }
  .drop { border:2px dashed #2f3947; border-radius:14px; padding:28px 12px; text-align:center; color:#9aa4b2; }
  .drop.over { border-color:#4c8dff; color:#cfe0ff; background:#182234; }
  .big { font-size:15px; color:#e8eaed; margin-bottom:6px; }
  .btns { display:flex; gap:10px; margin-top:14px; }
  button { appearance:none; border:0; border-radius:10px; padding:11px 16px; font-size:15px;
           background:#2b6cf6; color:#fff; font-weight:600; }
  button:active { transform:scale(.985); }
  button.ghost { background:#232a33; color:#c8d1dc; }
  button:disabled { opacity:.5; }
  .row { display:flex; gap:8px; align-items:center; }
  .file { display:flex; gap:10px; align-items:center; padding:11px 0; border-bottom:1px solid #232a33; }
  .file:last-child { border-bottom:0; }
  .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; }
  .meta { color:#8b949e; font-size:12px; margin-top:2px; }
  .bar { height:6px; background:#232a33; border-radius:99px; overflow:hidden; margin-top:12px; display:none; }
  .bar > i { display:block; height:100%; width:0; background:#2b6cf6; transition:width .15s linear; }
  .tip { color:#8b949e; font-size:12px; margin-top:10px; line-height:1.6; }
  .ok { color:#39d353; } .err { color:#ff6b6b; }
  .path { color:#6b7684; font-size:11px; }
</style>
</head>
<body>
  <h1>局域网快传</h1>
  <div class="sub">手机选文件或整个文件夹 → 传到电视，断了可以从断点接着传</div>

  <div class="card">
    <div class="drop" id="drop">
      <div class="big">点击选文件，或把文件拖进来</div>
      <div>APK / 图片 / 视频都行，支持整个文件夹</div>
    </div>
    <div class="btns">
      <button id="pickFiles">选文件</button>
      <button class="ghost" id="pickDir">选文件夹</button>
    </div>
    <input type="file" id="fileInput" multiple hidden>
    <input type="file" id="dirInput" webkitdirectory multiple hidden>
    <div class="bar" id="bar"><i id="barIn"></i></div>
    <div class="tip" id="status"></div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:6px">
      <div class="big" style="margin:0">电视上的文件</div>
      <button class="ghost" onclick="load()">刷新</button>
    </div>
    <div id="list"><div class="meta">加载中…</div></div>
  </div>

<script>
const CHUNK = 4 * 1024 * 1024;
const drop = document.getElementById('drop');
const bar = document.getElementById('bar');
const barIn = document.getElementById('barIn');
const statusEl = document.getElementById('status');
let busy = false;

function fmt(n){
  if (n > 1024*1024*1024) return (n/1024/1024/1024).toFixed(2) + ' GB';
  if (n > 1024*1024) return (n/1024/1024).toFixed(1) + ' MB';
  if (n > 1024) return (n/1024).toFixed(0) + ' KB';
  return n + ' B';
}
function setStatus(t, cls){
  statusEl.className = 'tip ' + (cls || '');
  statusEl.textContent = t;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

document.getElementById('pickFiles').onclick = () => document.getElementById('fileInput').click();
document.getElementById('pickDir').onclick = () => document.getElementById('dirInput').click();
document.getElementById('fileInput').onchange = e => {
  enqueue([...e.target.files].map(f => ({file:f, path:f.name})));
  e.target.value = '';
};
document.getElementById('dirInput').onchange = e => {
  enqueue([...e.target.files].map(f => ({file:f, path:(f.webkitRelativePath || f.name)})));
  e.target.value = '';
};
['dragover','dragenter'].forEach(t => drop.addEventListener(t, ev => { ev.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(t => drop.addEventListener(t, ev => { ev.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', ev => {
  enqueue([...ev.dataTransfer.files].map(f => ({file:f, path:f.name})));
});

async function stat(path){
  try {
    const r = await (await fetch('/api/stat?name=' + encodeURIComponent(path), {cache:'no-store'})).json();
    return r.exists ? r.size : 0;
  } catch (e) { return 0; }
}

function putChunk(path, offset, blob, onProgress){
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', '/upload?name=' + encodeURIComponent(path) + '&offset=' + offset);
    xhr.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded); };
    xhr.onload = () => {
      try { resolve(JSON.parse(xhr.responseText)); }
      catch (err) { reject(new Error('响应异常')); }
    };
    xhr.onerror = () => reject(new Error('网络中断'));
    xhr.ontimeout = () => reject(new Error('超时'));
    xhr.timeout = 120000;
    xhr.send(blob);
  });
}

async function uploadOne(item, onBytes){
  const file = item.file, path = item.path;
  let offset = await stat(path);
  if (offset > file.size) offset = 0;
  if (offset > 0) setStatus('接着上次的位置继续：' + path + '（已有 ' + fmt(offset) + '）');

  while (offset < file.size) {
    const end = Math.min(offset + CHUNK, file.size);
    const blob = file.slice(offset, end);
    let attempt = 0, done = false;
    while (!done) {
      try {
        const base = offset;
        const r = await putChunk(path, offset, blob, loaded => onBytes(base + loaded));
        if (r.ok) {
          offset = (r.size != null) ? r.size : end;
          onBytes(offset);
          done = true;
        } else if (r.restart) {
          offset = 0;
          done = true;
        } else {
          throw new Error(r.msg || '写入失败');
        }
      } catch (e) {
        attempt++;
        if (attempt >= 4) throw new Error(path + '：' + e.message);
        setStatus('连接中断，重试第 ' + attempt + ' 次…', 'err');
        await sleep(1500);
        offset = await stat(path);
      }
    }
  }
}

async function enqueue(items){
  if (busy) { setStatus('正在传输，等这一批结束', 'err'); return; }
  if (!items.length) return;
  busy = true;
  bar.style.display = 'block';
  const total = items.reduce((s, i) => s + i.file.size, 0);
  let sentBase = 0, currentSent = 0;
  const paint = () => {
    const pct = total ? Math.min(100, (sentBase + currentSent) / total * 100) : 0;
    barIn.style.width = pct.toFixed(1) + '%';
  };
  try {
    for (let i = 0; i < items.length; i++) {
      const item = items[i];
      setStatus('（' + (i + 1) + '/' + items.length + '）' + item.path);
      currentSent = 0;
      paint();
      await uploadOne(item, bytes => { currentSent = bytes; paint(); });
      sentBase += item.file.size;
      currentSent = 0;
      paint();
    }
    setStatus('全部发送完成，共 ' + items.length + ' 个文件', 'ok');
  } catch (e) {
    setStatus(e.message + '；已传完的部分留在电视上，重新选择会自动续传', 'err');
  } finally {
    busy = false;
    bar.style.display = 'none';
    barIn.style.width = '0%';
    load();
  }
}

async function load(){
  const box = document.getElementById('list');
  try {
    const r = await (await fetch('/api/files', {cache:'no-store'})).json();
    if (!r.files.length) { box.innerHTML = '<div class="meta">还没有文件</div>'; return; }
    box.innerHTML = r.files.map(f => `
      <div class="file">
        <div style="flex:1;min-width:0">
          <div class="name">${escapeHtml(f.name.split('/').pop())}</div>
          <div class="meta">${fmt(f.size)}${f.name.includes('/') ? ' · <span class="path">' + escapeHtml(f.name) + '</span>' : ''}</div>
        </div>
        <button onclick="install('${encodeURIComponent(f.name)}')">安装/打开</button>
        <button class="ghost" onclick="del('${encodeURIComponent(f.name)}')">删</button>
      </div>`).join('');
  } catch (e) {
    box.innerHTML = '<div class="meta err">读取失败</div>';
  }
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function install(name){
  const r = await (await fetch('/install?name=' + name, {method:'POST'})).json();
  setStatus(r.msg || (r.ok ? '已请求安装' : '失败'), r.ok ? 'ok' : 'err');
}

async function del(name){
  if (!confirm('删除这个文件？')) return;
  await fetch('/delete?name=' + name, {method:'POST'});
  load();
}

load();
setInterval(() => { if (!busy) load(); }, 5000);
</script>
</body>
</html>
