name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 编译 APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon -x lint

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: landrop-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 生成 update.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts | head -1)
          cat > update.json <<EOF
          {
            "version": "$VER",
            "versionCode": $CODE,
            "url": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-release.apk",
            "notes": "更新说明见 Release 页面",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat update.json

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            update.json
